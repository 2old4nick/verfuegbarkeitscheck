name: Verfügbarkeits-Check

on:
  schedule:
    # 6 UTC-Zeitpunkte, damit 10:00, 13:00 & 17:00 Berliner Zeit sowohl im Winter (UTC+1)
    # als auch im Sommer (UTC+2) abgedeckt sind. check.py filtert die "falschen" Läufe selbst raus.
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Check ausführen
        env:
          # Bei manuellem Start (Run workflow) immer prüfen, unabhängig von der Uhrzeit
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json index.html 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Update Verfügbarkeits-Status"
          git push
